name: "MCP smoke test"
description: "Headless runtime smoke-test for MCP servers (mcp-smoke)"
author: "Siddartha Reddy Chinthala"
inputs:
  cmd:
    description: "Server launch command (stdio transport)"
    required: false
  url:
    description: "Streamable HTTP endpoint"
    required: false
  args:
    description: "Extra mcp-smoke CLI flags"
    required: false
    default: ""
  fail-on-warn:
    description: "Exit non-zero on warnings too"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - run: |
        pipx install "mcp-smoke @ git+https://github.com/SIDDARTHAREDDY8/mcp-smoke.git@v1" \
          || pip install "git+https://github.com/SIDDARTHAREDDY8/mcp-smoke.git@v1"
        FLAGS="${{ inputs.args }}"
        if [ "${{ inputs.cmd }}" != "" ]; then FLAGS="$FLAGS --cmd \"${{ inputs.cmd }}\""; fi
        if [ "${{ inputs.url }}" != "" ]; then FLAGS="$FLAGS --url \"${{ inputs.url }}\""; fi
        if [ "${{ inputs.fail-on-warn }}" = "true" ]; then FLAGS="$FLAGS --fail-on-warn"; fi
        mcp-smoke $FLAGS --json --output "$GITHUB_WORKSPACE/mcp-smoke.json"
      shell: bash
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: mcp-smoke-report
        path: mcp-smoke.json
branding:
  icon: "activity"
  color: "green"
