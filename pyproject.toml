[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-smoke"
version = "0.1.0"
description = "Headless runtime smoke-tester for MCP servers: catches the silent failures that break agents in production"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Siddartha Reddy Chinthala" }]
keywords = ["mcp", "model-context-protocol", "testing", "smoke-test", "agents", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SIDDARTHAREDDY8/mcp-smoke"
Issues = "https://github.com/SIDDARTHAREDDY8/mcp-smoke/issues"

[project.scripts]
mcp-smoke = "mcp_smoke.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_smoke"]

[tool.pytest.ini_options]
testpaths = ["tests"]
