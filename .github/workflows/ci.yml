name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff ty coverage
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: Ruff format
        run: ruff format --check src/ tests/
      - name: ty
        run: ty check src/
      - name: Tests with coverage
        run: |
          coverage run -m pytest tests/ -q -p no:cacheprovider
          coverage report --include="src/mcp_smoke/*" --fail-under=90
      - name: Self-smoke (healthy fixture)
        run: python -m mcp_smoke --cmd "python tests/fixtures/healthy.py" --no-call
      - name: Self-smoke (polluting fixture must fail)
        run: |
          if python -m mcp_smoke --cmd "python tests/fixtures/polluting.py" --no-call; then
            echo "expected the polluting fixture to fail the smoke test" >&2
            exit 1
          fi
